<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="mono-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#mono-bg)" stroke="#1F2937" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Direction 4B: Teenage Engineering / Raycast Precision Monolith -->
  <!-- Subtle technical grid marks -->
  <line x1="64" y1="24" x2="64" y2="34" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="64" y1="94" x2="64" y2="104" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="64" x2="34" y2="64" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="94" y1="64" x2="104" y2="64" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central Precision Diagonal Laser Slice -->
  <rect x="42" y="59" width="44" height="10" rx="5" transform="rotate(-45 64 64)" fill="url(#laser-grad)" filter="url(#laser-glow)" />

  <!-- Orbiting Node Indicators -->
  <circle cx="42" cy="42" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="86" cy="86" r="3" fill="#10B981" />
  <circle cx="86" cy="42" r="2" fill="rgba(255,255,255,0.3)" />
  <circle cx="42" cy="86" r="2" fill="rgba(255,255,255,0.3)" />
</svg>
