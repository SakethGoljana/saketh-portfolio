<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="term-brk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131A" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="cursor-glow-brk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="bloom-brk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#term-brk-bg)" stroke="#1F2937" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Code Bracket Framing: < SG /> -->
  <!-- Left Angle Bracket '<' -->
  <path d="M 28 50 L 16 64 L 28 78" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold Vector 'S' in Titanium White -->
  <path d="M 59 44 L 42 44 C 38 44 35 47 35 52 L 35 56 C 35 61 38 64 42 64 L 52 64 C 56 64 59 67 59 72 L 59 76 C 59 81 56 84 52 84 L 35 84" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bold Vector 'G' in Electric Emerald -->
  <path d="M 89 44 L 72 44 C 68 44 65 47 65 52 L 65 76 C 65 81 68 84 72 84 L 89 84 C 89 84 89 64 89 64 L 78 64" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Closing Slash & Bracket '/>' -->
  <path d="M 100 78 L 108 50" fill="none" stroke="url(#cursor-glow-brk)" stroke-width="5" stroke-linecap="round" filter="url(#bloom-brk)" />
</svg>
