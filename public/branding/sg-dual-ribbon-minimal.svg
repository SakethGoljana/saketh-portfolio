<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#151A21"/>
      <stop offset="100%" stop-color="#080A0D"/>
    </radialGradient>

    <!-- Emerald Glow Ribbon -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Titanium Ribbon -->
    <linearGradient id="titaniumRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#cardBg)" stroke="#222B35" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Glowing Accent Core -->
  <circle cx="256" cy="256" r="120" fill="#10B981" opacity="0.12" filter="url(#bloom)"/>

  <!-- Dual Continuous Minimalist Geometry -->
  <g transform="translate(140, 130)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 'S' Upper Arch & Spine -->
    <path d="M 210 20 C 140 -15, 40 5, 20 60 C -5 130, 230 110, 210 180 C 190 235, 100 255, 30 220" 
          stroke="url(#emeraldRibbon)"/>

    <!-- 'G' Enclosing Arch & Return -->
    <path d="M 140 25 C 220 25, 245 70, 245 130 C 245 200, 190 245, 110 245 C 50 245, 10 215, 0 170" 
          stroke="url(#titaniumRibbon)" 
          stroke-opacity="0.85"/>

    <!-- G Spur / Center Crossbar -->
    <path d="M 125 135 L 235 135" 
          stroke="url(#emeraldRibbon)" 
          stroke-width="34"/>
  </g>
</svg>
