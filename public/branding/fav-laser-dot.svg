<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Minimalist 5: Pure Laser Aperture Node -->
  <rect width="128" height="128" rx="28" fill="#080C10" />
  
  <!-- Subtle Framing Reticle Ticks -->
  <line x1="64" y1="20" x2="64" y2="34" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="94" x2="64" y2="108" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="64" x2="34" y2="64" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />
  <line x1="94" y1="64" x2="108" y2="64" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />

  <!-- Outer Soft Bloom Halo -->
  <circle cx="64" cy="64" r="26" fill="url(#dot-glow)" opacity="0.35" />

  <!-- Solid Emerald Laser Beacon -->
  <circle cx="64" cy="64" r="14" fill="#10B981" />
  <circle cx="64" cy="64" r="7" fill="#7CF4D4" />
  <circle cx="62" cy="62" r="3" fill="#FFFFFF" />
</svg>
