<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="term-comp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131A" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="cursor-glow-comp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="bloom-comp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#term-comp-bg)" stroke="#1F2937" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Compact Monospace Command Prompt: > S G █ -->
  <!-- Prompt Chevron '>' in Muted Cyan/Gray -->
  <path d="M 18 52 L 29 64 L 18 76" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold Vector 'S' in Titanium White -->
  <path d="M 62 44 L 43 44 C 38 44 35 47 35 52 L 35 56 C 35 61 38 64 43 64 L 54 64 C 59 64 62 67 62 72 L 62 76 C 62 81 59 84 54 84 L 35 84" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bold Vector 'G' in Electric Emerald -->
  <path d="M 94 44 L 75 44 C 70 44 67 47 67 52 L 67 76 C 67 81 70 84 75 84 L 94 84 C 94 84 94 64 94 64 L 81 64" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Radiant High-Visibility Block Cursor '█' -->
  <rect x="103" y="42" width="12" height="44" rx="3" fill="url(#cursor-glow-comp)" filter="url(#bloom-comp)" />
</svg>
