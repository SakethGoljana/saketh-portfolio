<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14191E"/>
      <stop offset="100%" stop-color="#07090B"/>
    </radialGradient>

    <!-- Emerald / Mint Accent Gradient -->
    <linearGradient id="emeraldMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#7CF4D4"/>
    </linearGradient>

    <!-- Subtle Slate Secondary Ribbon -->
    <linearGradient id="slateGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Micro-Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" stroke="#22272E" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#emeraldMint)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Glowing Ambient Halo -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.08" filter="url(#glow)"/>

  <!-- Geometric Interlocking SG Monogram Paths -->
  <g transform="translate(256, 256)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter S Ribbon (Top-Left looping to center) -->
    <path d="M-64 -110 C-10 -110, 50 -110, 70 -60 C85 -20, 40 20, -10 30 C-60 40, -90 70, -75 115 C-60 150, -10 155, 30 145" 
          fill="none" 
          stroke="url(#emeraldMint)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Letter G Architectural Inset & Terminal -->
    <path d="M40 -10 C90 -10, 110 30, 110 80 C110 130, 60 155, 0 155 C-40 155, -80 140, -100 110" 
          fill="none" 
          stroke="url(#slateGrad)" 
          stroke-width="28" 
          stroke-opacity="0.75"
          stroke-linecap="round"/>

    <!-- G Crossbar Inset -->
    <path d="M40 75 L110 75" 
          stroke="url(#emeraldMint)" 
          stroke-width="32" 
          stroke-linecap="round"/>

    <!-- Terminal Spark Accent -->
    <circle cx="110" cy="75" r="8" fill="#7CF4D4"/>
  </g>
</svg>
