<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="chip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161F" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
    <linearGradient id="trace-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="pad-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#chip-bg)" stroke="#1F2937" stroke-width="1.5" />
  
  <!-- IC Die Border Frame -->
  <rect x="18" y="18" width="92" height="92" rx="10" fill="#0A0D13" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 2" />

  <!-- Perimeter Lead Pins / Contact Pads (IC Packaging) -->
  <!-- Top Pins -->
  <rect x="36" y="8" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="50" y="8" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="64" y="8" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="78" y="8" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="92" y="8" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />

  <!-- Bottom Pins -->
  <rect x="36" y="113" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="50" y="113" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="64" y="113" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="78" y="113" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />
  <rect x="92" y="113" width="6" height="7" rx="1.5" fill="url(#pad-silver)" />

  <!-- Left Pins -->
  <rect x="8" y="44" width="7" height="6" rx="1.5" fill="url(#pad-silver)" />
  <rect x="8" y="58" width="7" height="6" rx="1.5" fill="url(#pad-silver)" />
  <rect x="8" y="72" width="7" height="6" rx="1.5" fill="url(#pad-silver)" />

  <!-- Right Pins -->
  <rect x="113" y="44" width="7" height="6" rx="1.5" fill="url(#pad-silver)" />
  <rect x="113" y="58" width="7" height="6" rx="1.5" fill="url(#pad-silver)" />
  <rect x="113" y="72" width="7" height="6" rx="1.5" fill="url(#pad-silver)" />

  <!-- Technical Die Labels -->
  <text x="64" y="31" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" text-anchor="middle" letter-spacing="1">ARCH // CORE-SG</text>

  <!-- UNMISTAKABLE TECHNICAL 'S' BUS TRACE -->
  <path d="M 54 42 L 32 42 L 32 60 L 54 60 L 54 84 L 32 84" 
        fill="none" 
        stroke="url(#trace-emerald)" 
        stroke-width="7" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />

  <!-- UNMISTAKABLE TECHNICAL 'G' BUS TRACE -->
  <path d="M 96 42 L 74 42 L 74 84 L 96 84 L 96 63 L 85 63" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="square" 
        stroke-linejoin="miter" />

  <!-- Emerald Micro-Via Nodes on Traces -->
  <circle cx="54" cy="42" r="2.5" fill="#7CF4D4" />
  <circle cx="32" cy="84" r="2.5" fill="#7CF4D4" />
  <circle cx="96" cy="42" r="2.5" fill="#FFFFFF" />
  <circle cx="85" cy="63" r="2.5" fill="#10B981" />

  <!-- Technical Die Revision -->
  <text x="64" y="99" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="6" text-anchor="middle">REV 1.0 · DIE-35nm</text>
</svg>
