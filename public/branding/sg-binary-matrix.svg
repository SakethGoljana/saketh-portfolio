<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E13" />
      <stop offset="100%" stop-color="#030608" />
    </linearGradient>
    <linearGradient id="bit-on" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="bit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#matrix-bg)" stroke="#1A2430" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

  <!-- Binary Header Meta: 0x53 0x47 (Hex for 'S' and 'G') -->
  <text x="64" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">0x53 · 0x47</text>

  <!-- 7x5 Matrix Layout (Offset: X=20, Y=34, Cell=9, Gap=3.5) -->
  <g transform="translate(20, 33)">
    <!-- ROW 0 (Y=0) -->
    <!-- S -->
    <rect x="0" y="0" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="12.5" y="0" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="25" y="0" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <!-- Gap Col -->
    <rect x="37.5" y="0" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <!-- G -->
    <rect x="50" y="0" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="62.5" y="0" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="75" y="0" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />

    <!-- ROW 1 (Y=12.5) -->
    <!-- S -->
    <rect x="0" y="12.5" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="12.5" y="12.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <rect x="25" y="12.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <!-- Gap Col -->
    <rect x="37.5" y="12.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <!-- G -->
    <rect x="50" y="12.5" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="62.5" y="12.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <rect x="75" y="12.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />

    <!-- ROW 2 (Y=25) -->
    <!-- S -->
    <rect x="0" y="25" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="12.5" y="25" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="25" y="25" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <!-- Gap Col -->
    <rect x="37.5" y="25" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <!-- G (Crossbar) -->
    <rect x="50" y="25" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="62.5" y="25" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <rect x="75" y="25" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />

    <!-- ROW 3 (Y=37.5) -->
    <!-- S -->
    <rect x="0" y="37.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <rect x="12.5" y="37.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <rect x="25" y="37.5" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <!-- Gap Col -->
    <rect x="37.5" y="37.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <!-- G -->
    <rect x="50" y="37.5" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="62.5" y="37.5" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <rect x="75" y="37.5" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />

    <!-- ROW 4 (Y=50) -->
    <!-- S -->
    <rect x="0" y="50" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="12.5" y="50" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="25" y="50" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <!-- Gap Col -->
    <rect x="37.5" y="50" width="9" height="9" rx="2" fill="#131B24" opacity="0.4" />
    <!-- G -->
    <rect x="50" y="50" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="62.5" y="50" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
    <rect x="75" y="50" width="9" height="9" rx="2" fill="url(#bit-on)" filter="url(#bit-glow)" />
  </g>

  <!-- Technical Footer: Binary Bitstream -->
  <text x="64" y="110" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" letter-spacing="1">01010011 01000111</text>
</svg>
