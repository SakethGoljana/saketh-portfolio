<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12151A"/>
      <stop offset="100%" stop-color="#06080A"/>
    </radialGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="metallicWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg2)" stroke="#1F242C" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Architectural 45-degree Precision Stencil -->
  <g transform="translate(136, 126)" filter="url(#softShadow)">
    <!-- 'S' Segment 1: Upper Horizontal & Chamfer -->
    <path d="M 40 0 L 170 0 C 190 0, 200 15, 200 35 L 200 50 L 70 50 L 50 70 L 50 100 L 180 100 C 205 100, 220 115, 220 140 L 220 200 C 220 225, 200 245, 170 245 L 30 245 C 10 245, 0 230, 0 210 L 0 195 L 130 195 L 150 175 L 150 145 L 20 145 C -5 145, -20 130, -20 105 L -20 45 C -20 20, 0 0, 40 0 Z" 
          fill="url(#neonEmerald)"/>

    <!-- Interlocking 'G' Anchor Beam & Crossbar -->
    <!-- G Outer Curve & Inward Return -->
    <path d="M 120 70 L 190 70 C 230 70, 260 100, 260 145 L 260 185 C 260 230, 230 260, 185 260 L 95 260 C 55 260, 25 235, 25 200 L 75 200 C 75 215, 85 220, 100 220 L 180 220 C 205 220, 215 205, 215 180 L 215 155 L 135 155 L 135 115 L 215 115 L 215 110 C 215 90, 205 85, 180 85 L 120 85 Z" 
          fill="url(#metallicWhite)" 
          opacity="0.95"/>
  </g>
</svg>
