<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="ribbon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F13" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ribbon-bg)" stroke="#1F2937" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Direction 3B: Kinetic Pure S Lettermark -->
  <!-- Top Terminal Fin -->
  <circle cx="86" cy="38" r="7.5" fill="url(#spark-grad)" />

  <!-- Main S Spine -->
  <path d="M 86 38 C 76 38, 44 38, 44 54 C 44 68, 84 66, 84 82 C 84 96, 56 96, 42 96" 
        fill="none" 
        stroke="url(#ribbon-grad)" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bottom Terminal Fin -->
  <circle cx="42" cy="96" r="7.5" fill="#10B981" />

  <!-- High-tech speed cut at apex -->
  <line x1="68" y1="67" x2="60" y2="67" stroke="#0B0F13" stroke-width="3" stroke-linecap="round" />
</svg>
