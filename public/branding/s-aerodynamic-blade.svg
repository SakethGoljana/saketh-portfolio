<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="blade-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1317" />
      <stop offset="100%" stop-color="#05080A" />
    </linearGradient>
    <linearGradient id="blade-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blade-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="emerald-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#blade-bg)" stroke="#1F2937" stroke-width="1.5" />
  
  <!-- Subtle inner boundary reflection -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Direction 3A: Aerodynamic S Blade -->
  <!-- Upper Blade (Silver-White Titanium) -->
  <path d="M 90 34 C 90 29.5 86.5 26 82 26 L 46 26 C 36 26 30 33 30 42 C 30 52 38 58 50 62 L 72 69 C 78 71 82 74 82 79 C 82 81 81 83 79 84 L 92 84 C 95 80 96 75 96 70 C 96 57 86 50 74 46 L 52 39 C 48 37.5 46 35.5 46 33 C 46 30 49 28.5 54 28.5 L 82 28.5 C 83.5 28.5 85 29.5 85 31 Z" fill="url(#blade-silver)" />

  <!-- Lower Blade & Diagonal Fin (Radiant Emerald) -->
  <path d="M 38 94 C 38 98.5 41.5 102 46 102 L 82 102 C 92 102 98 95 98 86 C 98 76 90 70 78 66 L 56 59 C 50 57 46 54 46 49 C 46 47 47 45 49 44 L 36 44 C 33 48 32 53 32 58 C 32 71 42 78 54 82 L 76 89 C 80 90.5 82 92.5 82 95 C 82 98 79 99.5 74 99.5 L 46 99.5 C 44.5 99.5 43 98.5 43 97 Z" fill="url(#blade-glow)" filter="url(#emerald-bloom)" />

  <!-- Dynamic Center Energy Slash -->
  <polygon points="56,61 68,61 72,67 60,67" fill="#7CF4D4" opacity="0.9" />
</svg>
