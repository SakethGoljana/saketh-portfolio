<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="aperture-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#03070A" />
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bracket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#aperture-bg)" stroke="#1F2937" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Direction 4A: Precision Aperture Core -->
  
  <!-- Subtle Radar Grid / Axis -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" stroke-dasharray="3 3" />
  <circle cx="64" cy="64" r="22" fill="none" stroke="rgba(16,185,129,0.15)" stroke-width="1" />

  <!-- 4 Corner Framing Brackets (The Aperture / Lens) -->
  <!-- Top-Left Bracket -->
  <path d="M 36 50 L 36 38 C 36 37 37 36 38 36 L 50 36" fill="none" stroke="url(#bracket-grad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Top-Right Bracket -->
  <path d="M 78 36 L 90 36 C 91 36 92 37 92 38 L 92 50" fill="none" stroke="url(#bracket-grad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Bottom-Right Bracket -->
  <path d="M 92 78 L 92 90 C 92 91 91 92 90 92 L 78 92" fill="none" stroke="url(#bracket-grad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Bottom-Left Bracket -->
  <path d="M 50 92 L 38 92 C 37 92 36 91 36 90 L 36 78" fill="none" stroke="url(#bracket-grad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Outer Ambient Halo -->
  <circle cx="64" cy="64" r="18" fill="url(#core-glow)" opacity="0.4" />
  
  <!-- The Emerald Quantum Core Node -->
  <circle cx="64" cy="64" r="10" fill="#10B981" />
  <circle cx="64" cy="64" r="5" fill="#7CF4D4" />
  <circle cx="62" cy="62" r="2" fill="#FFFFFF" />
</svg>
