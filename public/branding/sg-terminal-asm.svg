<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="cursor-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#term-bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Terminal Title Bar -->
  <rect x="14" y="14" width="100" height="18" rx="5" fill="#131B24" />
  <circle cx="23" cy="23" r="2.5" fill="#EF4444" />
  <circle cx="31" cy="23" r="2.5" fill="#F59E0B" />
  <circle cx="39" cy="23" r="2.5" fill="#10B981" />
  <text x="68" y="25" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700">asm.sh</text>

  <!-- Terminal Body Area -->
  <!-- Prompt Chevron '>' -->
  <path d="M 22 52 L 32 60 L 22 68" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- THE BOLD MONOSPACE 'SG' GLYPHS -->
  <text x="40" y="74" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="800" letter-spacing="-1">S</text>
  <text x="65" y="74" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="800" letter-spacing="-1">G</text>

  <!-- Radiant Block Cursor '█' -->
  <rect x="94" y="44" width="10" height="32" rx="2" fill="url(#cursor-glow)" filter="url(#bloom)" />

  <!-- Bottom Shell Status / Assembly opcode -->
  <text x="24" y="98" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="600">mov</text>
  <text x="44" y="98" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="6.5">rax, 0x5347</text>
  <text x="96" y="98" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="6">; OK</text>
</svg>
