<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="vfd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C10" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="seg-on" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="vfd-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vfd-bg)" stroke="#1F2937" stroke-width="1.5" />
  
  <!-- Outer Display Glass Bezel -->
  <rect x="14" y="14" width="100" height="100" rx="14" fill="#05080C" stroke="#1E293B" stroke-width="1" />

  <!-- Sub-pixel Grid Mesh Background Texture -->
  <line x1="14" y1="64" x2="114" y2="64" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="64" y1="14" x2="64" y2="114" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Technical Header Display -->
  <text x="24" y="28" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700" letter-spacing="1">REG: SG</text>
  <circle cx="100" cy="26" r="2.5" fill="#10B981" />

  <!-- 7-SEGMENT 'S' (Centered Left, X=26) -->
  <!-- Top bar (A) -->
  <polygon points="30,36 56,36 52,42 34,42" fill="url(#seg-on)" filter="url(#vfd-bloom)" />
  <!-- Top-left vertical (F) -->
  <polygon points="28,38 34,44 34,60 28,63" fill="url(#seg-on)" filter="url(#vfd-bloom)" />
  <!-- Middle bar (G) -->
  <polygon points="32,63 54,63 52,69 34,69" fill="url(#seg-on)" filter="url(#vfd-bloom)" />
  <!-- Bottom-right vertical (C) -->
  <polygon points="56,66 56,92 50,88 50,71" fill="url(#seg-on)" filter="url(#vfd-bloom)" />
  <!-- Bottom bar (D) -->
  <polygon points="34,90 52,90 56,96 30,96" fill="url(#seg-on)" filter="url(#vfd-bloom)" />

  <!-- Inactive S segments (Dim ghost outline) -->
  <polygon points="56,38 56,62 50,59 50,44" fill="#0E161F" />
  <polygon points="28,66 34,71 34,88 28,92" fill="#0E161F" />

  <!-- 7-SEGMENT 'G' (Centered Right, X=72) -->
  <!-- Top bar (A) -->
  <polygon points="76,36 102,36 98,42 80,42" fill="#FFFFFF" />
  <!-- Top-left vertical (F) -->
  <polygon points="74,38 80,44 80,60 74,63" fill="#FFFFFF" />
  <!-- Bottom-left vertical (E) -->
  <polygon points="74,66 80,71 80,88 74,92" fill="#FFFFFF" />
  <!-- Bottom bar (D) -->
  <polygon points="80,90 98,90 102,96 76,96" fill="#FFFFFF" />
  <!-- Bottom-right vertical (C) -->
  <polygon points="102,66 102,92 96,88 96,71" fill="#FFFFFF" />
  <!-- Middle bar inner right (G) -->
  <polygon points="88,63 100,63 98,69 88,69" fill="#FFFFFF" />

  <!-- Inactive G segments -->
  <polygon points="102,38 102,62 96,59 96,44" fill="#0E161F" />

  <!-- Status Bit Indicator Dots -->
  <text x="64" y="106" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="5.5" text-anchor="middle" letter-spacing="1.5">SYS.CLK: 100MHz</text>
</svg>
