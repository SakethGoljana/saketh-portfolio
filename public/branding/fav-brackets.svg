<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Minimalist 4: Pure Code Syntax </> -->
  <rect width="128" height="128" rx="28" fill="#0A0E13" />
  <!-- Left Bracket '<' -->
  <path d="M 40 48 L 24 64 L 40 80" fill="none" stroke="#E2E8F0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center Slash '/' in Radiant Emerald -->
  <line x1="56" y1="84" x2="72" y2="44" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
  <!-- Right Bracket '>' -->
  <path d="M 88 48 L 104 64 L 88 80" fill="none" stroke="#E2E8F0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
</svg>
