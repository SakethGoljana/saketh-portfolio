<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="cursor-glow-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CF4D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="bloom-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#term-bg-c)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Terminal Title Bar -->
  <rect x="14" y="14" width="100" height="18" rx="5" fill="#131B24" />
  <circle cx="23" cy="23" r="2.5" fill="#EF4444" />
  <circle cx="31" cy="23" r="2.5" fill="#F59E0B" />
  <circle cx="39" cy="23" r="2.5" fill="#10B981" />
  <text x="68" y="25.5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="6.5" font-weight="700">asm.sh</text>

  <!-- Terminal Body Area -->
  <!-- Prompt Chevron '>' -->
  <path d="M 22 52 L 32 60 L 22 68" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vector 'S' (Crisp Geometric Path, Zero Font Dependency) -->
  <path d="M 58 46 L 43 46 C 40 46 38 48 38 51 L 38 56 C 38 59 40 61 43 61 L 53 61 C 56 61 58 63 58 66 L 58 71 C 58 74 56 76 53 76 L 38 76" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Vector 'G' (Crisp Geometric Path, Zero Font Dependency) -->
  <path d="M 84 46 L 69 46 C 66 46 64 48 64 51 L 64 71 C 64 74 66 76 69 76 L 84 76 C 84 76 84 62 84 62 L 74 62" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Radiant Block Cursor '█' -->
  <rect x="94" y="46" width="10" height="30" rx="2" fill="url(#cursor-glow-c)" filter="url(#bloom-c)" />

  <!-- Bottom Shell Status / Assembly Opcode -->
  <text x="24" y="98" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="6.5" font-weight="600">mov</text>
  <text x="44" y="98" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="6.5">rax, 0x5347</text>
  <text x="96" y="98" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="6">; OK</text>
</svg>
